name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Same Postgres + Redis images as the local docker-compose.yml, for the e2e tests
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: campusly
          POSTGRES_PASSWORD: campusly
          POSTGRES_DB: campusly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campusly -d campusly"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    # CI-only values (not secrets): the app validates them with zod at startup
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campusly:campusly@localhost:5432/campusly?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef012345678
      FRONTEND_URL: http://localhost:3001
      PORT_API: "3000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/package.json # pnpm version from "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile # postinstall runs `prisma generate`
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy # create the tables in the empty CI database
      - run: pnpm test:e2e
      # The e2e run rewrites schema.gql: a difference means the committed schema is out of date
      - run: git diff --exit-code -- schema.gql

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Types come from backend/schema.gql: regenerated types must equal the committed ones
      - run: pnpm codegen && git diff --exit-code -- libs/gql
      - run: pnpm check:locales
      - run: pnpm lint
      - run: pnpm typecheck

  # CD (DECISIONS §3): when both CI jobs pass on develop, the EC2 box deploys the backend.
  # GitHub gets a short-lived AWS role through OIDC (no stored keys) and runs deploy.sh on the box
  # with SSM Run Command, so SSH (port 22) stays closed to GitHub. Vercel deploys the frontend itself.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job ask GitHub for the OIDC token AWS trusts
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never stop a deploy halfway
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Run deploy.sh on the box
        # Pull first, then run the script: the box always runs the deploy.sh of this very commit
        # (a new or changed script would otherwise run one deploy late, or not exist yet)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1800 \
            --parameters '{"commands":["sudo -iu ubuntu bash -c \"cd ~/campusly && git pull --ff-only && bash backend/deploy/deploy.sh\""]}' \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          # The build takes minutes; poll instead of "aws ssm wait" (it gives up after ~100 s)
          for _ in $(seq 1 120); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]
