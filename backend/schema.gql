  name: String
  status: RecordStatus
}

type UploadTicket {
  assetId: String!
  expiresAt: DateTime!
  uploadUrl: String!
}

type User {
  createdAt: DateTime!
  firstName: String!
  id: String!
  lastName: String!
  locale: String!
  loginId: String!
  mustChangePassword: Boolean!
  role: Role!
  status: UserStatus!
}

type UserListItem {
  className: String
  createdAt: DateTime!
  firstName: String!
  id: String!
  lastActiveAt: DateTime
  lastName: String!
  links: [LinkedUser!]!
  loginId: String!
  passwordState: PasswordState!
  phone: String
  role: Role!
  status: UserStatus!
  tempPasswordUsesLeft: Int
  title: String
}

enum UserStatus {
  ACTIVE
  ARCHIVED
  BLOCKED
}

type Users {
  list: [UserListItem!]!
  metaCounter: TotalCounter!
}

input UsersInquiry {
  direction: Direction
  limit: Int!
  page: Int!
  search: UsersSearch!
  sort: String
}

input UsersSearch {
  groupId: String
  groupIds: [String!]
  passwordState: PasswordState
  role: Role!
  status: UserStatus
  text: String
}